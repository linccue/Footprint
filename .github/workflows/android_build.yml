name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # ===== 安装 Flutter 固定 3.24.5 稳定版 =====
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        cache: true

    # ===== 生成 flutter_ui/.android/include_flutter.groovy =====
    - name: Generate Flutter Android files
      working-directory: ./flutter_ui
      run: |
        flutter pub get
        if [ ! -f .android/include_flutter.groovy ]; then
          flutter build aar --debug
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        if [ -n "$FLUTTER_ROOT" ]; then
          echo "flutter.sdk=$FLUTTER_ROOT" >> local.properties
        fi
        if [ ! -z "${{ secrets.AMAP_KEY }}" ]; then
          echo "AMAP_KEY=${{ secrets.AMAP_KEY }}" >> local.properties
        else
          echo "AMAP_KEY=YOUR_DEBUG_KEY" >> local.properties
        fi

    # ===== 新增：Rust Android 编译目标 =====
    - name: Add Rust Android target
      run: rustup target add aarch64-linux-android

    # ===== 替换：用预编译二进制安装 cargo-ndk =====
    - name: Install cargo-ndk
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Get SHA1 for Debug Keystore
      run: ./gradlew signingReport

    # ===== 修正：APK 实际输出在 build/app_build_fresh/ 下 =====
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          build/app_build_fresh/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
