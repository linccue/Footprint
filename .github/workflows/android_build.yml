name: Android Build

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - "keystore/**"
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: '3.41.0'
        cache: true

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        if [ -n "$FLUTTER_ROOT" ]; then
          echo "flutter.sdk=$FLUTTER_ROOT" >> local.properties
        fi
        if [ ! -z "${{ secrets.AMAP_KEY }}" ]; then
          echo "AMAP_KEY=${{ secrets.AMAP_KEY }}" >> local.properties
        else
          echo "AMAP_KEY=YOUR_DEBUG_KEY" >> local.properties
        fi

    - name: Generate Flutter Android module
      working-directory: ./flutter_ui
      run: |
        flutter pub get
        if [ ! -f .android/include_flutter.groovy ]; then
          flutter build aar --debug
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Provide signing keystore
      env:
        SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
      run: |
        mkdir -p keystore
        if [ -n "$SIGN_KEYSTORE_BASE64" ]; then
          echo "$SIGN_KEYSTORE_BASE64" | base64 -d > keystore/app.jks
          echo "keystore ready: $(ls -l keystore/app.jks | awk '{print $5}') bytes"
        else
          echo "::warning::SIGN_KEYSTORE_BASE64 未配置，本次使用临时调试签名（SHA1 会变化）"
        fi

    - name: Add Rust Android target
      run: rustup target add aarch64-linux-android

    - name: Install cargo-ndk
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk

    - name: Build with Gradle
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -o pipefail
        ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

    - name: Publish signing info
      if: always()
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        git config user.name "ci-bot"
        git config user.email "ci-bot@users.noreply.github.com"
        {
          echo "package: com.footprint"
          if [ -f keystore/app.jks ]; then
            keytool -list -v -keystore keystore/app.jks \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" || true
          else
            keytool -list -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey || true
          fi
        } > ci-signing.txt 2>&1
        git checkout -B ci-info
        git add -f ci-signing.txt
        git commit -m "ci: signing info [skip ci]" || true
        git push -f origin ci-info

    - name: Publish build log on failure
      if: failure()
      run: |
        git config user.name "ci-bot"
        git config user.email "ci-bot@users.noreply.github.com"
        tail -c 300000 build.log > ci-build.log || true
        git checkout -B ci-build-log
        git add -f ci-build.log
        git commit -m "ci: capture build log [skip ci]" || true
        git push -f origin ci-build-log

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          build/app_build_fresh/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn