name: Android Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: '3.41.0'
        cache: true

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        if [ -n "$FLUTTER_ROOT" ]; then
          echo "flutter.sdk=$FLUTTER_ROOT" >> local.properties
        fi
        if [ ! -z "${{ secrets.AMAP_KEY }}" ]; then
          echo "AMAP_KEY=${{ secrets.AMAP_KEY }}" >> local.properties
        else
          echo "AMAP_KEY=YOUR_DEBUG_KEY" >> local.properties
        fi

    - name: Generate Flutter Android module
      working-directory: ./flutter_ui
      run: |
        flutter pub get
        if [ ! -f .android/include_flutter.groovy ]; then
          flutter build aar --debug
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Add Rust Android target
      run: rustup target add aarch64-linux-android

    - name: Install cargo-ndk
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk

    - name: Build with Gradle
      run: |
        set -o pipefail
        ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

    - name: Publish build log on failure
      if: failure()
      run: |
        git config user.name "ci-bot"
        git config user.email "ci-bot@users.noreply.github.com"
        tail -c 300000 build.log > ci-build.log || true
        git checkout -B ci-build-log
        git add -f ci-build.log
        git commit -m "ci: capture build log" || true
        git push -f origin ci-build-log

    - name: Get SHA1 for Debug Keystore
      if: success()
      run: ./gradlew signingReport

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          build/app_build_fresh/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn