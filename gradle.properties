org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=false
org.gradle.daemon=true

# AGP 9 + Flutter 兼容开关（必须）
android.builtInKotlin=false
android.newDsl=false

android.useAndroidX=true
android.enableJetifier=true

# Optimization flags for smaller APK size
android.enableResourceOptimizations=true
kotlin.incremental=false
android.suppressUnsupportedCompileSdk=35,36
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
